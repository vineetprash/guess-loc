<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Deduce location from images</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/index.2cdaf7bc.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- ONNX Runtime -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>
  <body class="h-screen w-screen flex">
    <!-- Sidebar -->
    <div class="w-80 bg-white shadow-lg p-6 flex flex-col space-y-6 z-10">
      <h1 class="text-2xl font-bold text-gray-800 mx-auto">
        🔎 Guess Location
      </h1>
      <p class="text-gray-600 text-sm mx-auto">
        Upload an image to detect location
      </p>

      <!-- Image Preview -->
      <canvas id="input-image-canvas" width="224" height="224" class="border rounded-lg shadow-md mx-auto">No input image</canvas>

      <!-- Status Display -->
      <div id="status-display" class="text-gray-700 text-sm text-center"></div>

      <!-- File Upload -->
      <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg shadow text-center">
        Choose an Image
        <input type="file" id="image-file" accept="image/png,image/jpeg" class="hidden">
      </label>
      <!-- Street View Button -->
      <a id="street-view-btn" class="bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-4 rounded-lg shadow text-center hidden" target="_blank">
        Open Google Street View
      </a>
    </div>

    <!-- Map (Takes up Full Remaining Space) -->
    <div id="output-map" class="absolute inset-0 ml-80"></div>

    <!-- Hidden img for loading user file -->
    <img id="input-image" class="hidden">

    <script src="/index.4d6bcbeb.js" defer=""></script>
  </body>
</html>
